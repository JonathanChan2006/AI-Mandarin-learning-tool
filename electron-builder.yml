appId: com.jonathanchan.mandarintutor
productName: Mandarin Tutor
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!{legacy,e2e,evals,tests,.github,.venv,test-results,playwright-report}/**'
  - '!{*.apkg,*.db}'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{vitest.config.ts,playwright.config.ts}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,.editorconfig,README.md}'
  - '!{.env,.env.*,.npmrc}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  - '**/*.node'
mac:
  target:
    - dmg
  entitlementsInherit: build/entitlements.mac.plist
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
win:
  executableName: MandarinTutor
  target:
    - nsis
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
npmRebuild: false
# No auto-update server; without this the builder infers one from the git remote.
publish: null
